name: Déploiement LWS

# Déploie le calendrier de l'avent (dossier avent/ + login.php + header.php) par FTP
# à chaque push sur main, ou à la demande (onglet Actions > Déploiement LWS > Run workflow).
# Les tests tournent sur toutes les branches ; le déploiement uniquement sur main.
on:
  push:
    paths:
      - 'avent/**'
      - 'login.php'
      - 'header.php'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  # Tests des jeux (PHP et parité PHP/JS) : le déploiement n'a lieu que s'ils passent.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests PHP
        run: for f in avent/jeux/*/test.php; do echo "== $f"; php "$f"; done

      - name: Tests de parité PHP/JS
        run: for f in avent/jeux/*/test.js; do echo "== $f"; node "$f"; done

  deploy:
    needs: tests
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-lws
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On n'envoie que le strict nécessaire : jamais includes/db.php, jamais de SQL,
      # jamais les images déjà téléversées en production (avent/uploads).
      - name: Préparer les fichiers à envoyer
        run: |
          mkdir -p deploy
          cp -r avent deploy/avent
          cp login.php header.php deploy/
          rm -rf deploy/avent/sql deploy/avent/README.md
          find deploy/avent/uploads -type f ! -name '.htaccess' -delete

      - name: Envoi par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: 'ftps'
          # Vérifie le certificat du serveur FTPS
          security: strict
          port: ${{ secrets.FTP_PORT || '21' }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          local-dir: ./deploy/
          # Ne supprime jamais ce qui existe déjà sur le serveur sans être suivi par le déploiement
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
